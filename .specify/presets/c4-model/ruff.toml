# Lint settings for the Python in scripts/ and tests/.
# Run: uvx ruff check .
target-version = "py39"
line-length = 120
extend-exclude = [".claude", "insights", "prompts"]

[lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear
    "UP",      # outdated syntax for the target Python
    "SIM",     # simplifications
    "C4",      # comprehensions
]
